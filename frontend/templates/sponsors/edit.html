{% extends "base.html" %}
{% block title %}Hariri kadi{% endblock %}
{% block content %}
<section class="card">
  <h1>Wasifu wa sponsa</h1>
  <p class="lead">Wanawake wanaona picha, jiji, umri na utangulizi kabla ya kulipa. Wasifu kamili hufunguliwa baada ya malipo.</p>
  <form method="post" enctype="multipart/form-data" class="stack">
    {% csrf_token %}
    {% for field in form %}
      <label>
        {{ field.label }}
        {{ field }}
        {{ field.errors }}
      </label>
    {% endfor %}
    <button class="btn btn-gold" type="submit">Hifadhi wasifu</button>
  </form>
</section>
{% endblock %}
