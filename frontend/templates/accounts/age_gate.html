{% extends "base.html" %}
{% block title %}Miaka 18+{% endblock %}
{% block content %}
<section class="card gate">
  <h1>Watu wazima pekee</h1>
  <p>Lazima uwe na umri wa miaka 18 au zaidi kutumia tovuti hii.</p>
  <form method="post">
    {% csrf_token %}
    <label class="check">
      <input type="checkbox" name="is_adult" required>
      Nina umri wa miaka 18 au zaidi
    </label>
    <button class="btn btn-gold" type="submit">Ingia</button>
  </form>
</section>
{% endblock %}
