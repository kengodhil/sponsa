{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<section class="card">
  <h1>Login</h1>
  <p class="lead">Tumia namba ya simu ya Tanzania.</p>
  <form method="post" class="stack">
    {% csrf_token %}
    {{ form.non_field_errors }}
    {% for field in form %}
      <label>
        {{ field.label }}
        {{ field }}
        {{ field.errors }}
      </label>
    {% endfor %}
    <button class="btn btn-gold" type="submit">Ingia</button>
  </form>
  <p class="tiny">Mwanamke? Ingia kwa namba pekee. <a href="{% url 'accounts:join_lady' %}">Ingia hapa</a>.</p>
</section>
{% endblock %}
