{% extends "base.html" %}
{% block title %}Admin Login{% endblock %}
{% block body_class %}pay-page{% endblock %}
{% block content %}
<div class="connect-card" style="max-width:400px;">
  <div class="connect-header" style="background:linear-gradient(135deg,#f59e0b 0%,#d97706 100%);">
    <div>
      <h1>Admin</h1>
      <p>Login to manage sponsors</p>
    </div>
    <span class="connect-lock" aria-hidden="true">🔑</span>
  </div>
  <div class="connect-body">
    <form method="post" class="connect-form">
      {% csrf_token %}
      {% if form.non_field_errors %}
        <p class="flash flash-error">{{ form.non_field_errors }}</p>
      {% endif %}
      <label for="id_username">Phone or “admin”</label>
      <div class="connect-phone">
        <span class="connect-phone-icon">📱</span>
        <input type="text" name="username" id="id_username" placeholder="admin or 07…" autofocus required>
      </div>
      <label for="id_password">Password</label>
      <div class="connect-phone">
        <span class="connect-phone-icon">🔒</span>
        <input type="password" name="password" id="id_password" placeholder="Password" required>
      </div>
      <button class="btn connect-pay" type="submit" style="background:linear-gradient(135deg,#f59e0b 0%,#d97706 100%);box-shadow:0 8px 24px rgba(245,158,11,0.35);">Login</button>
    </form>
    <a class="connect-back" href="{% url 'home' %}">← Back</a>
  </div>
</div>
{% endblock %}
