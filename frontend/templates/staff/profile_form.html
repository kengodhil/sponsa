{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<section class="card">
  <h1>{{ title }}</h1>
  <form method="post" enctype="multipart/form-data" class="stack">
    {% csrf_token %}
    {% for field in form %}
      <label>
        {{ field.label }}
        {{ field }}
        {{ field.errors }}
      </label>
    {% endfor %}
    <button class="btn btn-gold" type="submit">Save sponsor</button>
  </form>
  <p style="margin-top:16px;"><a href="{% url 'staff:dashboard' %}">← Back to Admin</a></p>
</section>
{% endblock %}
