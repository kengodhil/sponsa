{% extends "base.html" %}
{% block title %}Pakia CSV{% endblock %}
{% block content %}
<section class="card">
  <h1>Pakia CSV ya wafadhili</h1>
  <p>Safu: <code>public_name,age,city,lifestyle,preference,teaser,full_bio</code></p>
  <form method="post" enctype="multipart/form-data" class="stack">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn btn-gold" type="submit">Pakia na chapisha</button>
  </form>
</section>
{% endblock %}
