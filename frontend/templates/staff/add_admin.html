{% extends "base.html" %}
{% block title %}Add admin{% endblock %}
{% block content %}
<section class="card" style="max-width:420px;margin:0 auto;">
  <h1>Add admin</h1>
  <p class="lead">Create a new staff admin who can log in with phone and password.</p>

  <form method="post" class="stack">
    {% csrf_token %}
    {% for field in form %}
      <label>
        {{ field.label }}
        {{ field }}
        {{ field.errors }}
      </label>
    {% endfor %}
    <button class="btn btn-gold" type="submit">Create admin</button>
  </form>
  <p style="margin-top:16px;"><a href="{% url 'staff:dashboard' %}">← Back to Admin</a></p>
</section>
{% endblock %}
